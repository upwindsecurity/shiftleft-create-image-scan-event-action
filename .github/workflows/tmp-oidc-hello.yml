# TEMPORARY - delete after the Marketplace has met the service principal.
# One-shot OIDC hello: runs as upwind-marketplace-publisher-ci via the
# Marketplace environment's federated credential and calls profiles/me,
# which materializes the SP's identity in the Marketplace identity store
# so it can be added as a publisher member.
name: tmp-oidc-hello

on:
  push:
    branches: [azure-image-scan-task]
    paths: ['.github/workflows/tmp-oidc-hello.yml']

permissions:
  contents: read
  id-token: write

jobs:
  hello:
    runs-on: ubuntu-latest
    environment: Marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Materialize SP identity (profiles/me)
        run: |
          az rest -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query '{id: id, displayName: displayName}' -o json
