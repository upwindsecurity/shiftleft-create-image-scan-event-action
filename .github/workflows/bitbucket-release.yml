# Publishes the Bitbucket pipe image. The pipe versions independently of the
# GitHub action, in its own tag namespace: tag `bitbucket-vX.Y.Z` to release.
# The image is ghcr.io/<owner>/code-image-scan-bitbucket with docker tags
# vX.Y.Z (immutable pin), vX (floating major), latest.
name: Bitbucket Pipe Release

on:
  push:
    tags: ['bitbucket-v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Only exact bitbucket-vX.Y.Z tags may publish: an rc/prerelease tag
      # (bitbucket-v0.2.0-rc1) matches the trigger glob, and without this guard
      # it would re-publish the release docker tags with prerelease code.
      - name: Validate release tag
        run: |
          [[ "${{ github.ref_name }}" =~ ^bitbucket-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Not an exact release tag: ${{ github.ref_name }}"; exit 1; }

      - uses: actions/checkout@v6

      - name: Tests
        working-directory: bitbucket
        run: |
          bash tests/run_tests.sh
          bash tests/run_pipe_tests.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/code-image-scan-bitbucket
          tags: |
            type=match,pattern=^bitbucket-(v\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^bitbucket-(v\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bitbucket/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Bitbucket pulls pipes anonymously, and ghcr packages start private, so
      # a private package means every customer pull fails. Fail the release
      # until an org admin flips the package to Public (one-time); rerun after.
      - name: Check package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api "/orgs/${{ github.repository_owner }}/packages/container/code-image-scan-bitbucket" --jq .visibility 2>/dev/null) || {
            echo "::warning::Could not read package visibility (fork or missing permission); verify it is Public manually."
            exit 0
          }
          if [ "$visibility" != "public" ]; then
            echo "::error::ghcr.io/${{ github.repository_owner }}/code-image-scan-bitbucket is '$visibility'. Customers cannot pull it: an org admin must set the package to Public (package settings > Danger Zone > Change visibility), then rerun this workflow."
            exit 1
          fi
          echo "Package is public."
