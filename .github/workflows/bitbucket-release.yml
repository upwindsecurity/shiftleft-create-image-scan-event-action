# Publishes the Bitbucket pipe image. The pipe versions independently of the
# GitHub action, in its own tag namespace: tag `bitbucket-vX.Y.Z` to release.
# The image is ghcr.io/<owner>/code-image-scan-bitbucket with docker tags
# vX.Y.Z (immutable pin), vX (floating major), latest.
name: Bitbucket Pipe Release

on:
  push:
    tags: ['bitbucket-v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tests
        working-directory: bitbucket
        run: |
          bash tests/run_tests.sh
          bash tests/run_pipe_tests.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/code-image-scan-bitbucket
          tags: |
            type=match,pattern=bitbucket-(v\d+\.\d+\.\d+),group=1
            type=match,pattern=bitbucket-(v\d+)\.,group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: bitbucket
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
