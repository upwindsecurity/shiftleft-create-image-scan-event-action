# Publishes the Upwind image scan Azure DevOps extension to the Visual Studio
# Marketplace. The extension versions independently of the GitHub action
# (`v*.*.*`) and the Bitbucket pipe (`bitbucket-v*.*.*`), in its own tag
# namespaces:
#   azure-dev-vX.Y.Z -> azure/vss-extension.dev.json (upwind-image-scan-dev, private)
#   azure-vX.Y.Z     -> azure/vss-extension.json     (upwind-image-scan)
#
# Authenticates to the Marketplace with Microsoft Entra OIDC; there is no
# stored secret. The job requests a GitHub OIDC token (environment
# `marketplace`), azure/login exchanges it for an Entra token as the app
# registration `upwind-marketplace-publisher-ci`, and the VSIX is uploaded
# through the Marketplace Gallery REST API with that bearer token.
# One-time setup:
#   - The app has a federated credential with subject
#     repo:upwindsecurity/shiftleft-create-image-scan-event-action:environment:marketplace
#     (issuer https://token.actions.githubusercontent.com,
#     audience api://AzureADTokenExchange).
#   - The app's service principal is a member (Contributor) of the Marketplace
#     publisher `upwindsecurity`.
#   - Repo variables AZURE_MARKETPLACE_CLIENT_ID and AZURE_TENANT_ID hold the
#     app and tenant ids (public identifiers, not secrets).
name: Azure Task Release

on:
  push:
    tags:
      - 'azure-v*.*.*'
      - 'azure-dev-v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v6

      - name: Comment script tests
        run: bash azure/tests/run_comment_tests.sh

      - name: Task tests
        run: bash azure/tests/run_task_tests.sh

      - name: Launcher tests
        run: bash azure/tests/run_launcher_tests.sh

      # Derive VERSION and MANIFEST from the tag with an explicit match on the
      # whole ref name, so an azure-dev-v* tag can never select the prod
      # manifest. The version must be strictly numeric X.Y.Z.
      - name: Resolve version and manifest from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^azure-dev-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            MANIFEST=azure/vss-extension.dev.json
          elif [[ "$TAG" =~ ^azure-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            MANIFEST=azure/vss-extension.json
          else
            echo "::error::Unsupported tag '$TAG' (expected azure-vX.Y.Z or azure-dev-vX.Y.Z)"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "Releasing $VERSION with $MANIFEST"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      # Both versions must bump or Azure DevOps ignores the update: the
      # extension manifest version and the task.json version object.
      - name: Sync versions
        run: |
          set -euo pipefail
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"
          jq --argjson maj "$MAJOR" --argjson min "$MINOR" --argjson pat "$PATCH" \
            '.version = {Major: $maj, Minor: $min, Patch: $pat}' \
            azure/task/task.json > azure/task/task.json.tmp
          mv azure/task/task.json.tmp azure/task/task.json
          jq '.version' "$MANIFEST" azure/task/task.json

      # Packaging needs no credentials.
      - name: Package extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vsix"
          npx tfx-cli extension create \
            --manifest-globs "$MANIFEST" \
            --output-path "$RUNNER_TEMP/vsix" \
            --no-prompt
          ls "$RUNNER_TEMP/vsix"/*.vsix

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Resource 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which
      # the Marketplace accepts. POST creates a new extension, PUT updates an
      # existing one; any non-2xx response fails the job with its body.
      - name: Publish extension
        run: |
          set -euo pipefail
          PUBLISHER=$(jq -r '.publisher' "$MANIFEST")
          EXT_ID=$(jq -r '.id' "$MANIFEST")
          VSIX=$(ls "$RUNNER_TEMP"/vsix/*.vsix)
          BASE="https://marketplace.visualstudio.com/_apis/gallery/publishers/$PUBLISHER/extensions"
          API="api-version=7.1-preview.2"

          TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken --output tsv)
          echo "::add-mask::$TOKEN"

          BODY="$RUNNER_TEMP/response.json"
          status() {
            curl --silent --show-error --output "$BODY" --write-out '%{http_code}' \
              --header "Authorization: Bearer $TOKEN" "$@"
          }

          EXISTS=$(status "$BASE/$EXT_ID?$API")
          case "$EXISTS" in
            200) METHOD=PUT;  URL="$BASE/$EXT_ID?$API" ;;
            404) METHOD=POST; URL="$BASE?$API" ;;
            *)
              echo "::error::Lookup of $PUBLISHER.$EXT_ID failed with HTTP $EXISTS"
              cat "$BODY"
              exit 1
              ;;
          esac

          echo "Uploading $(basename "$VSIX") with $METHOD"
          CODE=$(status --request "$METHOD" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$VSIX" "$URL")
          if [[ ! "$CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Marketplace upload failed with HTTP $CODE"
            cat "$BODY"
            exit 1
          fi
          echo "Published $PUBLISHER.$EXT_ID $VERSION (HTTP $CODE)"
